name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install "yt-dlp[default]" youtube-transcript-api
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          yt-dlp --version
      - name: run probe
        env:
          PROBE_ENV: GITHUB_ACTIONS_DATACENTER
          PROBE_OUT: ${{ github.workspace }}/probe_actions.json
        run: python probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-results
          path: probe_actions.json
