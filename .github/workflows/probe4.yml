name: probe4
on:
  workflow_dispatch:
jobs:
  probe4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q "yt-dlp[default]" && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python probe4.py
