name: stt-bench
on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Runner specs
        run: |
          echo "nproc: $(nproc)"
          grep -m1 "model name" /proc/cpuinfo
          free -g | head -2
          uname -a

      - name: ffmpeg + audio prep
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -version | head -1
          ffmpeg -y -i bench10min.opus -ac 1 -ar 16000 -c:a pcm_s16le bench.wav 2>/dev/null
          ffprobe -v error -show_entries format=duration -of csv=p=0 bench.wav
          ls -la bench.wav

      - name: faster-whisper install
        run: |
          python -m pip install -q -U faster-whisper
          python -c "import faster_whisper,ctranslate2;print('fw',faster_whisper.__version__,'ct2',ctranslate2.__version__)"

      - name: "BENCH A  faster-whisper large-v3-turbo int8 (4 threads)"
        continue-on-error: true
        timeout-minutes: 45
        run: python3 bench_fw.py large-v3-turbo int8 4

      - name: "BENCH B  faster-whisper small int8 (4 threads)"
        continue-on-error: true
        timeout-minutes: 30
        run: python3 bench_fw.py small int8 4

      - name: "BENCH C  faster-whisper base int8 (4 threads)"
        continue-on-error: true
        timeout-minutes: 20
        run: python3 bench_fw.py base int8 4

      - name: "BENCH D  whisper.cpp large-v3-turbo q5_0 (4 threads)"
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set -e
          git clone -q --depth 1 https://github.com/ggml-org/whisper.cpp.git wcpp
          cd wcpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build -j$(nproc) --config Release 2>&1 | tail -3
          T0=$(date +%s)
          bash ./models/download-ggml-model.sh large-v3-turbo-q5_0 2>&1 | tail -2
          T1=$(date +%s); echo "MODEL_DOWNLOAD_SEC=$((T1-T0))"
          ls -la models/ggml-large-v3-turbo-q5_0.bin
          T2=$(date +%s)
          ./build/bin/whisper-cli -m models/ggml-large-v3-turbo-q5_0.bin -f ../bench.wav -t 4 -np -otxt -of ../wcpp_out 2>&1 | tail -20
          T3=$(date +%s)
          echo "WCPP_TRANSCRIBE_SEC=$((T3-T2))"
          echo "AUDIO_SEC=600  RTF=$(python3 -c "print(round($((T3-T2))/600,3))")"
          head -c 300 ../wcpp_out.txt
