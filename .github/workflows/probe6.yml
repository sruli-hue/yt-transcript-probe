name: probe6
on:
  workflow_dispatch:
jobs:
  warp:
    runs-on: ubuntu-latest
    strategy: {fail-fast: false, matrix: {rep: [1, 2, 3]}}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          pip install -q "yt-dlp[default]"
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools ffmpeg
      - name: WARP up
        env: {WARP_CONF: "${{ secrets.WARP_CONF }}"}
        run: |
          echo "before=$(curl -s --max-time 20 https://api.ipify.org)"
          printf '%s\n' "$WARP_CONF" | sudo tee /etc/wireguard/warp.conf >/dev/null
          sudo chmod 600 /etc/wireguard/warp.conf
          sudo wg-quick up warp
          sleep 5
          echo "after=$(curl -s --max-time 25 https://api.ipify.org)"
      - name: captions on 8 real videos
        run: |
          set +e
          for V in Xi0fKbOz9ZA vAsA_t_5a-I 02Ns6EbCplY ZG05bAvq9PY -H50QxEApYg sflvFeqAsBE ofOQYgsqjYg xiXsDPguMgc; do
            rm -rf /tmp/o && mkdir -p /tmp/o
            yt-dlp --skip-download --write-auto-subs --write-subs \
              --sub-langs "en.*,en,iw,he,ar" --sub-format vtt/best --no-warnings --no-playlist \
              -o "/tmp/o/%(id)s.%(ext)s" -- "$V" 2>/tmp/e.txt
            F=$(ls /tmp/o/*.vtt 2>/dev/null | head -1)
            if [ -n "$F" ]; then echo "PASS $V $(wc -c <"$F")B $(basename "$F")"
            elif grep -q "not a bot" /tmp/e.txt; then echo "FAIL $V BOT-WALL"
            else echo "FAIL $V $(grep ERROR /tmp/e.txt|head -1|cut -c1-80)"; fi
            sleep 3
          done
      - name: audio for caption-less 71min hearing (Whisper path)
        run: |
          set +e
          rm -rf /tmp/a && mkdir -p /tmp/a
          S=$(date +%s)
          yt-dlp -f bestaudio/best --no-warnings --no-playlist \
            -x --audio-format mp3 --audio-quality 9 \
            --postprocessor-args "ffmpeg:-ac 1 -ar 16000 -b:a 24k" \
            -o "/tmp/a/a.%(ext)s" -- dBDww47UKSM 2>/tmp/ea.txt
          E=$(date +%s)
          F=/tmp/a/a.mp3
          if [ -f "$F" ]; then
            echo "PASS audio FULL 71min: $(( $(stat -c%s $F) / 1000000 ))MB in $((E-S))s (Groq free cap 25MB/req)"
          elif grep -q "not a bot" /tmp/ea.txt; then echo "FAIL audio BOT-WALL"
          else echo "FAIL audio $(grep ERROR /tmp/ea.txt|head -1|cut -c1-90)"; fi
