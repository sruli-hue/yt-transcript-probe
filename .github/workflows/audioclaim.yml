name: audioclaim
on:
  workflow_dispatch:

jobs:
  audioclaim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: egress IP
        run: |
          IP=$(curl -s --max-time 15 https://api.ipify.org)
          echo "egress IPv4: $IP"
          curl -s --max-time 15 "https://ipinfo.io/$IP/json" || true

      - name: install
        run: |
          python -m pip install -q -U yt-dlp
          yt-dlp --version
          ffmpeg -version | head -1

      - name: "A. ClipMaker's EXACT caption command, from the datacenter"
        continue-on-error: true
        run: |
          set +e
          for V in 09XnM4XHjuk 2c7EmoMPlFs 5mrCEbg9tAs; do
            echo "===== CAPTIONS $V ====="
            rm -rf capt; mkdir capt
            timeout 180 yt-dlp \
              --skip-download \
              --write-subs \
              --write-auto-subs \
              --sub-langs "en,en-orig,en-US,en-GB" \
              --sub-format json3 \
              -o "capt/%(id)s" -- "https://www.youtube.com/watch?v=$V" 2>&1 | tail -8
            echo "EXIT=${PIPESTATUS[0]}"
            ls -la capt/ 2>/dev/null
            for f in capt/*.json3; do
              [ -e "$f" ] || continue
              echo "--- $f bytes=$(wc -c < "$f")"
              python3 -c "
import json,sys
d=json.load(open('$f'))
ev=[e for e in d.get('events',[]) if e.get('segs')]
print('json3 events with text:',len(ev))
print('first:',json.dumps(ev[0])[:220] if ev else 'NONE')
"
            done
          done

      - name: "B. The EXACT audio command from download_and_transcribe_via_groq"
        continue-on-error: true
        run: |
          set +e
          for V in 09XnM4XHjuk 2c7EmoMPlFs 5mrCEbg9tAs; do
            echo "===== AUDIO $V ====="
            rm -rf aud; mkdir aud
            timeout 600 yt-dlp -x -o "aud/raw.%(ext)s" -- "https://www.youtube.com/watch?v=$V" 2>&1 | tail -15
            echo "EXIT=${PIPESTATUS[0]}"
            ls -la aud/ 2>/dev/null
          done

      - name: "C. control: Rick Astley audio"
        continue-on-error: true
        run: |
          set +e
          rm -rf ctl; mkdir ctl
          timeout 600 yt-dlp -x -o "ctl/raw.%(ext)s" -- "https://www.youtube.com/watch?v=dQw4w9WgXcQ" 2>&1 | tail -15
          echo "EXIT=${PIPESTATUS[0]}"
          ls -la ctl/ 2>/dev/null
