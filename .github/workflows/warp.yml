name: warp
on:
  workflow_dispatch:
    inputs:
      vid:
        description: "YouTube video id"
        default: "dQw4w9WgXcQ"

jobs:
  warp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install -q -U yt-dlp

      - name: "W0  baseline egress"
        run: |
          IP=$(curl -s --max-time 15 https://api.ipify.org); echo "direct egress: $IP"
          curl -s --max-time 15 "https://ipinfo.io/$IP/json" | head -20

      - name: "W1  bring up Cloudflare WARP (free) as SOCKS5"
        continue-on-error: true
        run: |
          set +e
          docker run -d --name warp --restart=always \
            -p 1080:1080 \
            -e WARP_SLEEP=2 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp 2>&1 | tail -3
          for i in $(seq 1 30); do
            curl -sf --max-time 5 --socks5-hostname 127.0.0.1:1080 https://api.ipify.org >/dev/null && break
            sleep 4
          done
          echo "--- warp container log ---"; docker logs warp 2>&1 | tail -20
          echo "--- warp trace ---"
          curl -s --max-time 20 --socks5-hostname 127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace/ | head -20
          WIP=$(curl -s --max-time 20 --socks5-hostname 127.0.0.1:1080 https://api.ipify.org)
          echo "WARP egress: $WIP"
          curl -s --max-time 20 "https://ipinfo.io/$WIP/json" | head -20

      - name: "W2  yt-dlp THROUGH warp"
        continue-on-error: true
        run: |
          set +e
          VID="${{ github.event.inputs.vid }}"
          echo "===== direct (control) ====="
          timeout 120 yt-dlp --skip-download --no-warnings \
            --print "OK %(title).50s subs=%(subtitles.keys)s auto=%(automatic_captions.keys)s" \
            "https://www.youtube.com/watch?v=$VID" 2>&1 | head -5
          echo "===== via WARP socks5 ====="
          timeout 180 yt-dlp --proxy "socks5://127.0.0.1:1080" --skip-download --no-warnings \
            --print "OK %(title).50s subs=%(subtitles.keys)s auto=%(automatic_captions.keys)s" \
            "https://www.youtube.com/watch?v=$VID" 2>&1 | head -8
          echo "===== via WARP: actually download subtitles ====="
          timeout 240 yt-dlp --proxy "socks5://127.0.0.1:1080" \
            --skip-download --write-auto-subs --write-subs --sub-langs "en.*" \
            --sub-format "vtt/best" -o "w.%(ext)s" \
            "https://www.youtube.com/watch?v=$VID" 2>&1 | tail -10
          ls -la w.* 2>/dev/null
          for f in w.*.vtt; do [ -f "$f" ] && echo "--- $f ---" && head -c 500 "$f"; done

      - name: "W3  WARP + audio download (the no-captions path)"
        continue-on-error: true
        run: |
          set +e
          VID="${{ github.event.inputs.vid }}"
          timeout 300 yt-dlp --proxy "socks5://127.0.0.1:1080" \
            -f "bestaudio[ext=m4a]/bestaudio" --max-filesize 60M \
            -o "aud.%(ext)s" "https://www.youtube.com/watch?v=$VID" 2>&1 | tail -12
          ls -la aud.* 2>/dev/null || echo "NO AUDIO FILE"
