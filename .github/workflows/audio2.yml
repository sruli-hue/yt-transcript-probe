name: audio2
on:
  workflow_dispatch:
jobs:
  audio2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: egress
        run: |
          IP=$(curl -s --max-time 15 https://api.ipify.org)
          echo "egress IPv4: $IP"
          curl -s --max-time 15 "https://ipinfo.io/$IP/json" || true
      - name: install
        run: |
          python -m pip install -q -U yt-dlp
          yt-dlp --version
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1
          ffmpeg -version | head -1
      - name: captions exact clipmaker command
        continue-on-error: true
        run: |
          set +e
          for V in 09XnM4XHjuk 2c7EmoMPlFs 5mrCEbg9tAs; do
            echo "===== CAPTIONS $V ====="
            rm -rf capt; mkdir capt
            yt-dlp --skip-download --write-subs --write-auto-subs --sub-langs "en,en-orig,en-US,en-GB" --sub-format json3 -o "capt/%(id)s" -- "https://www.youtube.com/watch?v=$V" > c.out 2>&1
            echo "EXIT=$?"
            tail -6 c.out
            ls -la capt/
            sleep 3
          done
      - name: audio exact groq-fallback command
        continue-on-error: true
        run: |
          set +e
          for V in 09XnM4XHjuk 2c7EmoMPlFs 5mrCEbg9tAs dQw4w9WgXcQ; do
            echo "===== AUDIO $V ====="
            rm -rf aud; mkdir aud
            S=$(date +%s)
            yt-dlp -x -o "aud/raw.%(ext)s" -- "https://www.youtube.com/watch?v=$V" > a.out 2>&1
            echo "EXIT=$? secs=$(( $(date +%s) - S ))"
            tail -8 a.out
            ls -la aud/
            sleep 3
          done
