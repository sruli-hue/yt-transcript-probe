name: probe3
on:
  workflow_dispatch:
jobs:
  probe3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q "yt-dlp[default]" youtube-transcript-api
      - run: python probe3.py
